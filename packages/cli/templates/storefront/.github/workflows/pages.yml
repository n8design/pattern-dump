# Builds the website and the workbench, and publishes both to GitHub Pages: the website at the address in
# storefront.url (your domain, or a project page's address with its path), the workbench inside it at
# workbench/ (build.basePath gives its full path).
# Before the first run: Settings → Pages → Source: "GitHub Actions", and your custom domain: see "Publish it" in the README.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a deploy that has started is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history: a layout that shows page dates needs it, and pd build refuses a shallow clone then.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # pd build writes the website (site/) and the workbench (dist/) side by side; Pages takes one folder.
      - run: |
          mkdir _site
          cp -R site/. _site/
          cp -R dist _site/workbench
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
