<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <style>.layer { fill: var(--color-fill); stroke: var(--color-line); stroke-width: 4; }</style>
  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="var(--color-line)"/>
      <stop offset="1" stop-color="var(--color-line)" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect class="layer" x="20" y="20" width="360" height="70"/>
  <rect x="20" y="110" width="360" height="70" fill="url(#fade)"/>
</svg>
