<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" role="img" aria-labelledby="title desc">
  <title id="title">Pattern Dump package architecture</title>
  <desc id="desc">contracts is the base. config, build, hotreloader, a11y and discovery depend on it; renderer depends on discovery. dev-server integrates config, build, hotreloader, a11y, discovery and renderer. core depends on dev-server and config; cli depends on core and dev-server. The dev-ui shell uses only the contracts types and talks to dev-server over HTTP and WebSocket.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .box-accent { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .panel { fill: none; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .t { fill: #1f2328; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h { fill: #1f2328; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .s { fill: #59636e; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { fill: #59636e; font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a { fill: #0969da; }
    .edge { fill: none; stroke: #818b98; stroke-width: 1.5; }
    .edge-accent { fill: none; stroke: #0969da; stroke-width: 1.75; }
    .dash { stroke-dasharray: 5 4; }
    .head { fill: #818b98; }
    .head-accent { fill: #0969da; }
    .num { fill: #0969da; }
    .num-t { fill: #ffffff; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #151b23; stroke: #3d444d; }
      .box-accent { fill: #0c2d6b; stroke: #4493f8; }
      .panel { stroke: #3d444d; }
      .t, .h { fill: #f0f6fc; }
      .s, .m { fill: #9198a1; }
      .a { fill: #4493f8; }
      .edge { stroke: #656c76; }
      .edge-accent { stroke: #4493f8; }
      .head { fill: #656c76; }
      .head-accent, .num { fill: #4493f8; }
      .num-t { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head-accent" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="610" rx="12"/>
  <rect class="box" x="300" y="30" width="200" height="48" rx="8"/>
  <text class="t" x="400" y="60" text-anchor="middle">contracts</text>
  <rect class="box" x="40" y="140" width="120" height="48" rx="8"/>
  <text class="t" x="100" y="170" text-anchor="middle">config</text>
  <path class="edge" d="M100,140 L340,82" marker-end="url(#arr)"/>
  <rect class="box" x="180" y="140" width="120" height="48" rx="8"/>
  <text class="t" x="240" y="170" text-anchor="middle">build</text>
  <path class="edge" d="M240,140 L370,82" marker-end="url(#arr)"/>
  <rect class="box" x="320" y="140" width="120" height="48" rx="8"/>
  <text class="t" x="380" y="170" text-anchor="middle">hotreloader</text>
  <path class="edge" d="M380,140 L400,82" marker-end="url(#arr)"/>
  <rect class="box" x="460" y="140" width="120" height="48" rx="8"/>
  <text class="t" x="520" y="170" text-anchor="middle">a11y</text>
  <path class="edge" d="M520,140 L430,82" marker-end="url(#arr)"/>
  <rect class="box" x="600" y="140" width="120" height="48" rx="8"/>
  <text class="t" x="660" y="170" text-anchor="middle">discovery</text>
  <path class="edge" d="M660,140 L460,82" marker-end="url(#arr)"/>
  <rect class="box" x="640" y="250" width="120" height="48" rx="8"/>
  <text class="t" x="700" y="280" text-anchor="middle">renderer</text>
  <path class="edge" d="M680,250 L680,192" marker-end="url(#arr)"/>
  <rect class="box-accent" x="40" y="350" width="740" height="64" rx="8"/>
  <text class="t" x="410" y="378" text-anchor="middle">dev-server</text>
  <text class="s" x="410" y="400" text-anchor="middle">preview documents · data API · live reload · derived graphs · audit · static build · export</text>
  <path class="edge" d="M100,350 L100,192" marker-end="url(#arr)"/>
  <path class="edge" d="M240,350 L240,192" marker-end="url(#arr)"/>
  <path class="edge" d="M380,350 L380,192" marker-end="url(#arr)"/>
  <path class="edge" d="M520,350 L520,192" marker-end="url(#arr)"/>
  <path class="edge" d="M620,350 L620,192" marker-end="url(#arr)"/>
  <path class="edge" d="M720,350 L720,302" marker-end="url(#arr)"/>
  <rect class="box" x="180" y="470" width="140" height="48" rx="8"/>
  <text class="t" x="250" y="500" text-anchor="middle">core</text>
  <rect class="box" x="460" y="470" width="140" height="48" rx="8"/>
  <text class="t" x="530" y="500" text-anchor="middle">cli</text>
  <text class="s" x="530" y="538" text-anchor="middle">the pd binary</text>
  <path class="edge" d="M250,470 L250,418" marker-end="url(#arr)"/>
  <path class="edge" d="M530,470 L530,418" marker-end="url(#arr)"/>
  <path class="edge" d="M460,494 L324,494" marker-end="url(#arr)"/>
  <path class="edge" d="M180,494 H20 V164 L36,164" marker-end="url(#arr)"/>
  <rect class="box" x="830" y="140" width="150" height="64" rx="8"/>
  <text class="t" x="905" y="168" text-anchor="middle">dev-ui</text>
  <text class="s" x="905" y="190" text-anchor="middle">workbench shell</text>
  <path class="edge dash" d="M905,140 C905,70 620,54 504,54" marker-end="url(#arr)"/>
  <text class="s" x="700" y="40" text-anchor="middle">types only</text>
  <path class="edge-accent dash" d="M905,204 C905,300 900,382 784,382" marker-end="url(#arr-a)" marker-start="url(#arr-a)"/>
  <text class="s" x="890" y="290" text-anchor="end">HTTP + WebSocket</text>
  <text class="s" x="890" y="308" text-anchor="end">at runtime</text>
  <text class="s" x="20" y="590" text-anchor="start">Arrows point from a package to what it depends on. Every package also uses contracts.</text>
</svg>
