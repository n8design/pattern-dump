name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per pull request: a new push cancels the run still going for the one before it. Runs on main
# are never cancelled, each push there runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    # Pinned: ubuntu-latest moved to 26.04, which the Playwright in use (1.60) cannot install browsers
    # on. Moving off the pin goes with a Playwright upgrade and a re-recorded E2E baseline.
    runs-on: ubuntu-24.04
    # Raised from 20: this job now also runs lint, typecheck and unit tests on top of installing
    # browsers and running the serial E2E suites (workers:1, required while HMR specs mutate
    # test-bench in place).
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          # Storefront pages take their dates from git, and pd build refuses a shallow clone's: the
          # storefront E2E reads page dates, so it needs the whole history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint CSS
        run: |
          npm run lint:css --workspace @pattern-dump/dev-ui
          npm run lint:css --workspace storefront-bench
          npm run lint:css --workspace @pattern-dump/skin-experimental
          npm run lint:css --workspace package-bench

      - name: Lint JS/TS
        run: npm run lint

      # Before the build: a type error is cheap to surface and the build is the slow step.
      - name: Typecheck
        run: npm run typecheck

      - name: Build packages
        run: npm run build

      # The runner's file-watching limits, on record: pd dev's watcher fails startup by name when it
      # cannot watch, and these are the first thing to check when it does.
      - name: Show inotify limits
        run: |
          echo "max_user_watches:   $(cat /proc/sys/fs/inotify/max_user_watches)"
          echo "max_user_instances: $(cat /proc/sys/fs/inotify/max_user_instances)"
          echo "max_queued_events:  $(cat /proc/sys/fs/inotify/max_queued_events)"

      # After the build: dev-server's test target dependsOn renderer:build.
      - name: Unit tests
        run: npm test

      - name: Burn-in script tests
        run: npm run test:scripts

      # The browser only, no system packages: the runner image already has every library and font Chromium
      # needs here (--with-deps only added nine CJK and X11 font packages, and with them an apt fetch that fails
      # whenever the Ubuntu mirror cannot be reached). A library missing from a future image fails the launch,
      # naming it.
      - name: Install Playwright browsers
        run: npx playwright install chromium

      # Pattern Dump packed as it is published, installed into a fresh project outside the repository
      # (pd init), then booted, audited and built there: what a user installing it gets. After the browsers:
      # it reads the website starter's built pages with axe in Chromium.
      - name: Check the packed package in a fresh project
        run: npm run verify:install

      - name: Run E2E tests
        run: npm run e2e --workspace @pattern-dump/dev-ui

      - name: Run storefront E2E tests
        run: npm run e2e:storefront

      - name: Run experimental skin E2E tests
        run: npm run e2e:skin-experimental

      - name: Run package bench E2E tests
        run: npm run e2e:package-bench

      - name: Upload Playwright traces and videos on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            apps/dev-ui/test-results/
            apps/dev-ui/playwright-report/
            storefront-bench/test-results/
            skins/experimental/test-results/
            package-bench/test-results/
          retention-days: 7

  # Every spec a pull request adds or changes (and the watcher specs, when the harness or the dev-server
  # changes) runs 20 times with retries off, beside one CPU hog: the runner has two cores, and a test
  # that depends on timing shows there. It runs next to the e2e job, not after it, and not on main,
  # where the whole suite already runs. What is repeated is decided in scripts/ci/burn-in.mjs, and split
  # into groups by measured time (scripts/ci/burn-in-times.json): burn-in-plan lists the groups, and each
  # repeats on its own runner, with its own hog.
  burn-in-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.plan.outputs.groups }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The diff against the base branch needs its history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Plan the groups
        id: plan
        run: |
          groups="$(node scripts/ci/burn-in.mjs --base "origin/${{ github.base_ref }}" --matrix)"
          echo "$groups"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  burn-in:
    needs: burn-in-plan
    if: needs.burn-in-plan.outputs.groups != '[]'
    name: burn-in (${{ matrix.group.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # One failing group fails the pull request; the others need not finish.
      fail-fast: true
      matrix:
        group: ${{ fromJSON(needs.burn-in-plan.outputs.groups) }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The storefront specs read page dates from git, so they need the whole history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build

      - name: Install Playwright browsers
        if: matrix.group.runner == 'playwright'
        # The browser only, as in the e2e job above.
        run: npx playwright install chromium

      - name: Install the load generator
        run: sudo apt-get install -y --no-install-recommends stress-ng

      - name: Repeat the group's specs
        env:
          GROUP: ${{ toJSON(matrix.group) }}
        run: node scripts/ci/burn-in.mjs --job "$GROUP" --runs 20 --load

      - name: Upload Playwright traces and videos on failure
        if: failure() && matrix.group.runner == 'playwright'
        uses: actions/upload-artifact@v7
        with:
          name: burn-in-report-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            apps/dev-ui/test-results/
            storefront-bench/test-results/
            skins/experimental/test-results/
            package-bench/test-results/
          retention-days: 7
