name: Golden

# test-bench's workbench, built at a pull request's base and at its head (scripts/golden): output that changes must be
# named in what the pull request adds to GOLDEN-CHANGES.md.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  golden:
    name: golden check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit, for its worktree and for what the pull request adds to GOLDEN-CHANGES.md.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both builds use the head's scripts, on this runner. The base gets a worktree of its own. When the pull request
      # leaves package-lock.json as it is, the base gets a copy of every node_modules folder (the root's, and a
      # workspace's own where npm put a version there): npm links each workspace package relatively
      # (node_modules/@pattern-dump/core -> ../../packages/core), so the copy runs the base's own code with the same
      # dependencies. When the pull request changes the lockfile, the base installs its own, so an output change the
      # new dependencies cause shows here instead of being built into both sides.
      - name: Set up the base
        run: |
          cp -R scripts/golden "$RUNNER_TEMP/golden"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          if git diff --quiet "$BASE" HEAD -- package-lock.json; then
            echo "package-lock.json is unchanged: the base runs with the head's dependencies"
            find . -name node_modules -type d -prune -not -path "./.git/*" | while read -r d; do
              if [ -d "$RUNNER_TEMP/base/$(dirname "$d")" ]; then cp -a "$d" "$RUNNER_TEMP/base/$d"; fi
            done
          else
            echo "package-lock.json changes: the base installs its own dependencies"
            (cd "$RUNNER_TEMP/base" && npm ci)
          fi

      - name: Build the golden at the base, twice
        run: |
          node "$RUNNER_TEMP/golden/build.mjs" --repo "$RUNNER_TEMP/base" "$BASE" "$RUNNER_TEMP/out-base"
          node "$RUNNER_TEMP/golden/build.mjs" --repo "$RUNNER_TEMP/base" "$BASE" "$RUNNER_TEMP/out-base-again"

      # Two builds of one commit must be the same, or no difference between base and head could be trusted.
      - name: The base twice is the same
        run: node "$RUNNER_TEMP/golden/diff.mjs" "$RUNNER_TEMP/out-base" "$RUNNER_TEMP/out-base-again"

      - name: Build the golden at the head
        run: node "$RUNNER_TEMP/golden/build.mjs" --repo . HEAD "$RUNNER_TEMP/out-head"

      - name: Check the changes against GOLDEN-CHANGES.md
        run: node "$RUNNER_TEMP/golden/check.mjs" "$RUNNER_TEMP/out-base" "$RUNNER_TEMP/out-head" "$BASE" HEAD
